<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Gerador de QR Code</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app">
    <div class="card">
        <h1>Gerador de QR Code</h1>
        <p class="subtitle">
            Gere QR Codes instantaneamente <br>a partir de textos ou links
        </p>

        <div class="input-group">
            <input
                type="text"
                id="qrInput"
                placeholder="Digite um texto ou URL"
                oninput="atualizarQR()"
            >
            <span id="tipoConteudo"></span>
        </div>

        <div id="qrPreview" class="qr-box"></div>

        <button id="downloadBtn" onclick="baixarQR()" disabled>
            Baixar QR Code
        </button>
    </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="script.js"></script>

</body>
</html>
